services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    container_name: knowflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: knowflow
      POSTGRES_PASSWORD: knowflow
      POSTGRES_DB: knowflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow -d knowflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
